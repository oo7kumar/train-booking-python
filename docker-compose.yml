
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trainbooking
      POSTGRES_USER: trainuser
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainuser -d trainbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: localdevpassword
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        psql -h postgres -U trainuser -d trainbooking -v ON_ERROR_STOP=1
        -f /migrations/001_schema.sql &&
        psql -h postgres -U trainuser -d trainbooking -v ON_ERROR_STOP=1
        -f /migrations/002_seed.sql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: train-booking:1.0
    environment:
      DATABASE_URL: postgresql://trainuser:localdevpassword@postgres:5432/trainbooking
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data: