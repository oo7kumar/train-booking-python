apiVersion: v1
kind: Secret
metadata:
  name: train-booking-secrets
type: Opaque
stringData:
  postgres-password: "localdevpassword"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: trainbooking
            - name: POSTGRES_USER
              value: trainuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: train-booking-secrets
                  key: postgres-password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U trainuser -d trainbooking
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: batch/v1
kind: Job
metadata:
  name: train-booking-migrate
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: train-booking-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: train-booking-secrets
                  key: postgres-password
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U trainuser -d trainbooking; do
                echo "Waiting for PostgreSQL..."
                sleep 3
              done
              psql -h postgres -U trainuser -d trainbooking -v ON_ERROR_STOP=1 -f /migrations/001_schema.sql &&
              psql -h postgres -U trainuser -d trainbooking -v ON_ERROR_STOP=1 -f /migrations/002_seed.sql
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: train-booking-migrations
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: train-booking
  template:
    metadata:
      labels:
        app: train-booking
    spec:
      containers:
        - name: api
          image: train-booking:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: train-booking-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql://trainuser:$(POSTGRES_PASSWORD)@postgres:5432/trainbooking"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: train-booking
spec:
  type: NodePort
  selector:
    app: train-booking
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
