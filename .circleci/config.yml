version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout

      - run:
          name: Install Ruff
          command: python -m pip install ruff==0.17.0

      - run:
          name: Check code quality
          command: python -m ruff check .

  test:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest

      - run:
          name: Run all Python tests
          command: python -m pytest -v

  docker-build:
    docker:
      - image: cimg/base:current

    steps:
      - checkout

      - setup_remote_docker

      - run:
          name: Build Docker image
          command: docker build -t train-booking:ci .

workflows:
  train-booking-ci:
    jobs:
      - lint
      - test:
          requires:
            - lint
      - docker-build:
          requires:
            - test
